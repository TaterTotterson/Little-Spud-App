name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          raw_version="${RELEASE_TAG:-run-${GITHUB_RUN_NUMBER}}"
          version_name="${raw_version#v}"
          version_label="$(printf '%s' "$raw_version" | tr -c 'A-Za-z0-9._-' '-')"
          printf 'LITTLE_SPUD_VERSION_NAME=%s\n' "$version_name" >> "$GITHUB_ENV"
          printf 'LITTLE_SPUD_VERSION_CODE=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          printf 'RELEASE_VERSION_LABEL=%s\n' "$version_label" >> "$GITHUB_ENV"

      - name: Configure Android Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -z "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not configured; background FCM push will be disabled."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | openssl base64 -d -A -out android/app/google-services.json

      - name: Configure optional Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::Android signing secrets are not configured; the release APK and AAB will be unsigned."
            exit 0
          fi
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure all four Android release signing secrets or remove all four."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/little-spud-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | openssl base64 -d -A -out "$keystore_path"
          printf 'ANDROID_SIGNING_STORE_FILE=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Test, lint, and build Android
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Package Android assets
        shell: bash
        run: |
          mkdir -p release-assets
          apk_path="$(find android/app/build/outputs/apk/release -maxdepth 1 -name 'app-release*.apk' -print -quit)"
          aab_path="android/app/build/outputs/bundle/release/app-release.aab"
          if [[ -z "$apk_path" || ! -f "$aab_path" ]]; then
            echo "::error::Android release outputs were not produced."
            exit 1
          fi
          suffix=""
          if [[ "$apk_path" == *-unsigned.apk ]]; then
            suffix="-unsigned"
          fi
          apk_name="Little-Spud-Android-${RELEASE_VERSION_LABEL}${suffix}.apk"
          aab_name="Little-Spud-Android-${RELEASE_VERSION_LABEL}${suffix}.aab"
          cp "$apk_path" "release-assets/$apk_name"
          cp "$aab_path" "release-assets/$aab_name"
          cd release-assets
          sha256sum "$apk_name" > "$apk_name.sha256"
          sha256sum "$aab_name" > "$aab_name.sha256"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: little-spud-android
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  ios:
    name: iOS Simulator release
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Configure iOS Firebase
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [[ -n "$GOOGLE_SERVICE_INFO_BASE64" ]]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_BASE64" \
              | openssl base64 -d -A -out LittleSpud/GoogleService-Info.plist
          else
            echo "::warning::IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is not configured; background FCM push will be disabled."
            cp .github/ci/GoogleService-Info.disabled.plist LittleSpud/GoogleService-Info.plist
          fi

      - name: Set release label
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          raw_version="${RELEASE_TAG:-run-${GITHUB_RUN_NUMBER}}"
          version_label="$(printf '%s' "$raw_version" | tr -c 'A-Za-z0-9._-' '-')"
          printf 'RELEASE_VERSION_LABEL=%s\n' "$version_label" >> "$GITHUB_ENV"

      - name: Build iOS Simulator app
        env:
          LITTLE_SPUD_IOS_CONFIGURATION: Release
          LITTLE_SPUD_IOS_CODE_SIGNING_ALLOWED: "NO"
          LITTLE_SPUD_IOS_DERIVED_DATA: ${{ github.workspace }}/build/ci-ios
          LITTLE_SPUD_IOS_DESTINATION: generic/platform=iOS Simulator
        run: scripts/build_app.sh

      - name: Package iOS Simulator asset
        shell: bash
        run: |
          app_path="build/ci-ios/Build/Products/Release-iphonesimulator/LittleSpud.app"
          if [[ ! -d "$app_path" ]]; then
            echo "::error::The iOS Simulator app was not produced."
            exit 1
          fi
          mkdir -p release-assets
          archive_name="Little-Spud-iOS-Simulator-${RELEASE_VERSION_LABEL}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/$archive_name"
          cd release-assets
          shasum -a 256 "$archive_name" > "$archive_name.sha256"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: little-spud-ios
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Attach assets to GitHub Release
    if: github.event_name == 'release'
    needs: [android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: little-spud-*
          path: release-assets
          merge-multiple: true

      - name: Verify checksums
        working-directory: release-assets
        shell: bash
        run: |
          shopt -s nullglob
          checksum_files=(*.sha256)
          if (( ${#checksum_files[@]} == 0 )); then
            echo "::error::No release checksums were downloaded."
            exit 1
          fi
          sha256sum --check "${checksum_files[@]}"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
